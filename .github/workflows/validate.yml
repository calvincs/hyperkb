name: Validate code and documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          python -m pip install -e '.[all,dev]' -r website/requirements.txt
      - name: Test application and documentation renderer
        run: python -m pytest -q
      - name: Build and validate public site
        run: |
          python scripts/build_site.py
          python scripts/check_site.py
          python scripts/build_site.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: hyperkb-gh-pages
          path: .site-build/
          include-hidden-files: true
